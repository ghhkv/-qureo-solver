          const parsed = JSON.parse(raw);
          state.xp = parsed.xp || 0;
          state.streak = parsed.streak || 0;
          state.completedModes = parsed.completedModes || {};
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({

          streak: state.streak,
          completedModes: state.completedModes

      } catch (e) {}
    }

      window.__toastTimer = setTimeout(() => box.classList.add('hidden'), 2800);

        showToast(`🎉 مبروك! كسبت +${amount} XP`);

                  </div>
                  <div class="w-full h-3 rounded-full bg-slate-800 overflow-hidden border border-white/10">
                    <div class="h-full bg-gradient-to-l from-amber-500 via-yellow-400 to-emerald-400 progress-bar-fill" style="width: ${overallPct}%"></div>
                  </div>
                </div>
                <button id="btnQuickStart" type="button" class="px-5 py-3 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm btn-press shadow-lg shadow-amber-500/20">
                  ابدأ اللعب دلوقتي 🚀
                </button>
              </div>
            </div>
          </div>

          ${renderUnitGrid('الحضارة العربية وظهور الإسلام', 'الوحدة الأولى', unit1)}
          ${renderUnitGrid('الفتوحات الإسلامية وانتشار الإسلام', 'الوحدة الثانية', unit2)}
        </div>
      `;
    }

    function renderLesson() {
      const lesson = LESSONS.find(l => l.id === state.activeLessonId);
      if (!lesson) return '';
      const prog = getLessonProgress(lesson.id);

      const tabs = [
        { id: 'sim', label: '🎛️ المحاكي', done: state.completedModes[`${lesson.id}_sim`] },
        { id: 'deb', label: '🕵️ محكمة الشخصيات', done: state.completedModes[`${lesson.id}_deb`] },
        { id: 'boss', label: '😈 اصنع الفخ', done: state.completedModes[`${lesson.id}_boss`] },
        { id: 'quiz', label: '📝 بنك الأسئلة', done: state.completedModes[`${lesson.id}_quiz`] }
      ];

      let bodyHtml = '';
      if (state.activeTab === 'sim') bodyHtml = renderSimulator(lesson);
      if (state.activeTab === 'deb') bodyHtml = renderDebate(lesson);
      if (state.activeTab === 'boss') bodyHtml = renderBoss(lesson);
      if (state.activeTab === 'quiz') bodyHtml = renderQuiz(lesson);

      return `
        <div class="animate-pop">
          <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
            <button id="btnBackHome" type="button" class="px-4 py-2 rounded-xl glass text-sm font-bold text-slate-200 hover:text-amber-300 btn-press">
              → كل الدروس
            </button>
            <div class="text-xs font-bold text-amber-300 bg-amber-500/10 border border-amber-400/25 px-3 py-1.5 rounded-xl">
              تقدم الدرس: ${prog.done} / 4 تحديات
            </div>
          </div>

          <div class="glass rounded-3xl p-5 sm:p-7 mb-6 border border-white/10">
            <div class="flex items-center gap-3 mb-2">
              <span class="text-3xl">${lesson.icon}</span>
              <div>
                <div class="text-xs text-amber-400 font-bold">${lesson.unitTitle}</div>
                <h2 class="text-xl sm:text-2xl font-black text-white">${lesson.title}</h2>
              </div>
            </div>
            <p class="text-sm text-slate-300 mb-5">${lesson.summary}</p>

            <!-- Mode Tabs -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
              ${tabs.map(t => `
                <button type="button" data-tab="${t.id}" class="tab-btn px-3 py-2.5 rounded-xl text-xs sm:text-sm font-extrabold border transition-all btn-press flex items-center justify-center gap-1.5 ${state.activeTab === t.id ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-lg shadow-amber-500/20' : 'bg-slate-800/70 text-slate-300 border-white/10 hover:bg-slate-800'}">
                  <span>${t.label}</span>
                  ${t.done ? '<span>✅</span>' : ''}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="glass rounded-3xl p-5 sm:p-7 border border-white/10 animate-pop">
            ${bodyHtml}
          </div>
        </div>
      `;
    }

    function renderSimulator(lesson) {
      const sim = lesson.simulator;
      const vals = {};
      sim.controls.forEach(c => {
        vals[c.id] = state.simValues[c.id] !== undefined ? state.simValues[c.id] : c.default;
      });
      const res = state.simResult;

      return `
        <div>
          <div class="inline-block px-3 py-1 rounded-lg bg-sky-500/15 text-sky-300 text-xs font-bold mb-2">النمط ١: محاكي القرارات التاريخية</div>
          <h3 class="text-lg sm:text-xl font-extrabold text-white mb-2">${sim.title}</h3>
          <p class="text-sm text-slate-300 leading-relaxed mb-6">${sim.scenario}</p>

          <div class="space-y-4 mb-6">
            ${sim.controls.map(c => `
              <div class="p-4 rounded-2xl bg-slate-900/70 border border-white/10">
                <div class="flex justify-between items-center mb-2">
                  <label class="text-sm font-bold text-slate-200">${c.label}</label>
                  <span id="lbl_${c.id}" class="text-sm font-black text-amber-400">${vals[c.id]}%</span>
                </div>
                <input type="range" class="sim-slider w-full cursor-pointer" data-ctrl="${c.id}" min="${c.min}" max="${c.max}" value="${vals[c.id]}" />
              </div>
            `).join('')}
          </div>

          <button id="btnRunSim" type="button" class="w-full sm:w-auto px-6 py-3 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm btn-press">
            تنفيذ القرار الاستراتيجي ⚡
          </button>

          ${res ? `
            <div class="mt-6 p-5 rounded-2xl border animate-pop ${res.success ? 'bg-emerald-500/10 border-emerald-500/40' : 'bg-rose-500/10 border-rose-500/40'}">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                ${res.metrics.map(m => `
                  <div class="p-3 rounded-xl bg-slate-900/70 border border-white/10">
                    <div class="text-xs text-slate-400 mb-1">${m.name}</div>
                    <div class="text-lg font-black ${m.val >= 70 ? 'text-emerald-400' : 'text-amber-400'}">${m.val}%</div>
                  </div>
                `).join('')}
              </div>
              <p class="text-sm font-bold ${res.success ? 'text-emerald-200' : 'text-rose-200'} leading-relaxed">${res.feedback}</p>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderDebate(lesson) {
      const deb = lesson.debate;
      const res = state.debateResult;
      return `
        <div>
          <div class="inline-block px-3 py-1 rounded-lg bg-purple-500/15 text-purple-300 text-xs font-bold mb-2">النمط ٢: محكمة الشخصيات الحية</div>
          <div class="flex items-start gap-4 p-5 rounded-2xl bg-slate-900/80 border border-purple-500/30 mb-6">
            <div class="w-14 h-14 rounded-2xl bg-purple-500/20 border border-purple-400/40 flex items-center justify-center text-3xl shrink-0">
              ${deb.npcAvatar}
            </div>
            <div>
              <div class="text-sm font-extrabold text-white">${deb.npcName}</div>
              <div class="text-xs text-purple-300 mb-2">${deb.npcRole}</div>
              <p class="text-sm sm:text-base font-bold text-amber-200 leading-relaxed">${deb.claim}</p>
            </div>
          </div>

          <h4 class="text-sm sm:text-base font-extrabold text-white mb-3">${deb.question}</h4>
          <div class="space-y-3">
            ${deb.options.map((opt, idx) => `
              <button type="button" data-deb-idx="${idx}" class="deb-opt w-full text-right p-4 rounded-2xl border transition-all btn-press text-sm font-bold ${res && res.idx === idx ? (opt.correct ? 'bg-emerald-500/20 border-emerald-400 text-emerald-200' : 'bg-rose-500/20 border-rose-400 text-rose-200') : 'bg-slate-900/70 border-white/10 text-slate-200 hover:border-amber-400/50'}">
                ${opt.text}
              </button>
            `).join('')}
          </div>

          ${res ? `
            <div class="mt-5 p-4 rounded-2xl border animate-pop ${res.correct ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-200' : 'bg-rose-500/10 border-rose-500/40 text-rose-200'}">
              <p class="text-sm font-bold leading-relaxed">${res.reply}</p>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderBoss(lesson) {
      const boss = lesson.reverseBoss;
      const res = state.bossResult;
      return `
        <div>
          <div class="inline-block px-3 py-1 rounded-lg bg-rose-500/15 text-rose-300 text-xs font-bold mb-2">النمط ٣: القتال العكسي — أنت واضع الامتحان</div>
          <h3 class="text-lg font-extrabold text-white mb-1">${boss.prompt}</h3>
          <p class="text-xs text-slate-400 mb-5">الموضوع: ${boss.topic}</p>

          <div class="space-y-3">
            ${boss.traps.map((t, idx) => `
              <button type="button" data-boss-idx="${idx}" class="boss-opt w-full text-right p-4 rounded-2xl border transition-all btn-press ${res && res.idx === idx ? 'bg-amber-500/15 border-amber-400' : 'bg-slate-900/70 border-white/10 hover:border-amber-400/50'}">
                <div class="text-sm font-extrabold text-amber-300 mb-1">${t.title}</div>
                <div class="text-xs text-slate-300">${t.question}</div>
              </button>
            `).join('')}
          </div>

          ${res ? `
            <div class="mt-6 p-5 rounded-2xl bg-slate-900/90 border border-amber-400/40 animate-pop">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-slate-400">🤖 إجابة البوت المنافس:</span>
                <span class="px-2.5 py-0.5 rounded-full text-xs font-black ${res.trap.score >= 80 ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-300'}">
                  قوة الفخ: ${res.trap.score}/100
                </span>
              </div>
              <p class="text-sm font-bold text-white mb-3 p-3 rounded-xl bg-slate-800">${res.trap.botGuess}</p>
              <p class="text-sm text-amber-200 leading-relaxed">💡 <strong>التحليل:</strong> ${res.trap.explanation}</p>
            </div>
          ` : ''}
        </div>
      `;
    }

    function renderQuiz(lesson) {
      const qs = lesson.quiz;
      return `
        <div>
          <div class="inline-block px-3 py-1 rounded-lg bg-emerald-500/15 text-emerald-300 text-xs font-bold mb-2">النمط ٤: أسئلة الفهم والتحليل (نظام الامتحان)</div>
          <div class="space-y-6 mt-4">
            ${qs.map((item, qIdx) => {
              const picked = state.quizAnswers[qIdx];
              return `
                <div class="p-4 sm:p-5 rounded-2xl bg-slate-900/70 border border-white/10">
                  <h4 class="text-sm sm:text-base font-extrabold text-white mb-3">${qIdx + 1}. ${item.q}</h4>
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    ${item.opts.map((opt, oIdx) => {
                      let cls = 'bg-slate-800/80 border-white/10 text-slate-200 hover:border-amber-400/50';
                      if (picked !== undefined) {
                        if (oIdx === item.ans) cls = 'bg-emerald-500/20 border-emerald-400 text-emerald-200';
                        else if (oIdx === picked) cls = 'bg-rose-500/20 border-rose-400 text-rose-200';
                      }
                      return `
                        <button type="button" data-q-idx="${qIdx}" data-o-idx="${oIdx}" class="quiz-opt text-right p-3 rounded-xl border text-xs sm:text-sm font-bold transition-all btn-press ${cls}">
                          ${opt}
                        </button>
                      `;
                    }).join('')}
                  </div>
                  ${picked !== undefined ? `
                    <div class="mt-3 text-xs sm:text-sm text-amber-200 bg-amber-500/10 border border-amber-400/25 p-3 rounded-xl">
                      <strong>سبب الإجابة:</strong> ${item.exp}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    // =========================================================
    // 5. EVENT BINDINGS
    // =========================================================
    function bindHomeEvents() {
      document.querySelectorAll('.lesson-card').forEach(btn => {
        btn.addEventListener('click', () => {
          AudioFX.play('click');
          openLesson(btn.dataset.lessonId);
        });
      });
      const qsBtn = document.getElementById('btnQuickStart');
      if (qsBtn) {
        qsBtn.addEventListener('click', () => {
          AudioFX.play('click');
          const next = LESSONS.find(l => getLessonProgress(l.id).done < 4) || LESSONS[0];
          openLesson(next.id);
        });
      }
    }

    function openLesson(lessonId) {
      state.currentView = 'lesson';
      state.activeLessonId = lessonId;
      state.activeTab = 'sim';
      state.simValues = {};
      state.simResult = null;
      state.debateResult = null;
      state.bossResult = null;
      state.quizAnswers = {};
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function bindLessonEvents() {
      const backBtn = document.getElementById('btnBackHome');
      if (backBtn) {
        backBtn.addEventListener('click', () => {
          AudioFX.play('click');
          state.currentView = 'home';
          render();
        });
      }

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          AudioFX.play('click');
          state.activeTab = btn.dataset.tab;
          render();
        });
      });

      // Simulator
      document.querySelectorAll('.sim-slider').forEach(slider => {
        slider.addEventListener('input', (e) => {
          const id = e.target.dataset.ctrl;
          state.simValues[id] = Number(e.target.value);
          const lbl = document.getElementById(`lbl_${id}`);
          if (lbl) lbl.textContent = `${e.target.value}%`;
        });
      });

      const runSimBtn = document.getElementById('btnRunSim');
      if (runSimBtn) {
        runSimBtn.addEventListener('click', () => {
          const lesson = LESSONS.find(l => l.id === state.activeLessonId);
          const vals = {};
          lesson.simulator.controls.forEach(c => {
            vals[c.id] = state.simValues[c.id] !== undefined ? state.simValues[c.id] : c.default;
          });
          state.simResult = lesson.simulator.evaluate(vals);
          if (state.simResult.success) {
            AudioFX.play('win');
            awardXP(`${lesson.id}_sim`, 50);
          } else {
            AudioFX.play('fail');
          }
          render();
        });
      }

      // Debate
      document.querySelectorAll('.deb-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const lesson = LESSONS.find(l => l.id === state.activeLessonId);
          const idx = Number(btn.dataset.debIdx);
          const opt = lesson.debate.options[idx];
          state.debateResult = { idx, correct: opt.correct, reply: opt.reply };
          if (opt.correct) {
            AudioFX.play('win');
            awardXP(`${lesson.id}_deb`, 50);
          } else {
            AudioFX.play('fail');
          }
          render();
        });
      });

      // Reverse Boss
      document.querySelectorAll('.boss-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const lesson = LESSONS.find(l => l.id === state.activeLessonId);
          const idx = Number(btn.dataset.bossIdx);
          const trap = lesson.reverseBoss.traps[idx];
          state.bossResult = { idx, trap };
          if (trap.score >= 80) {
            AudioFX.play('win');
            awardXP(`${lesson.id}_boss`, 60);
          } else {
            AudioFX.play('click');
            showToast('فخ لطيف، بس جرب تختار فخ تحليل وربط عشان تاخد النقط كاملة!');
          }
          render();
        });
      });

      // Quiz
      document.querySelectorAll('.quiz-opt').forEach(btn => {
        btn.addEventListener('click', () => {
          const lesson = LESSONS.find(l => l.id === state.activeLessonId);
          const qIdx = Number(btn.dataset.qIdx);
          const oIdx = Number(btn.dataset.oIdx);
          state.quizAnswers[qIdx] = oIdx;
          const isRight = oIdx === lesson.quiz[qIdx].ans;
          AudioFX.play(isRight ? 'win' : 'fail');

          const allAnswered = lesson.quiz.every((_, i) => state.quizAnswers[i] !== undefined);
          const allCorrect = lesson.quiz.every((q, i) => state.quizAnswers[i] === q.ans);
          if (allAnswered && allCorrect) {
            awardXP(`${lesson.id}_quiz`, 40);
          }
          render();
        });
      });
    }

    // Global Header Controls
    document.getElementById('btnHome').addEventListener('click', () => {
      AudioFX.play('click');
      state.currentView = 'home';
      render();
    });

    document.getElementById('btnSound').addEventListener('click', (e) => {
      AudioFX.enabled = !AudioFX.enabled;
      e.target.textContent = AudioFX.enabled ? '🔊 الصوت: شغال' : '🔇 الصوت: صامت';
      if (AudioFX.enabled) AudioFX.play('click');
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      const m = document.getElementById('resetModal');
      m.classList.remove('hidden');
      m.classList.add('flex');
    });

    document.getElementById('btnCancelReset').addEventListener('click', () => {
      const m = document.getElementById('resetModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
    });

    document.getElementById('btnConfirmReset').addEventListener('click', () => {
      state.xp = 0;
      state.streak = 0;
      state.completedModes = {};
      saveState();
      const m = document.getElementById('resetModal');
      m.classList.add('hidden');
      m.classList.remove('flex');
      showToast('تم مسح التقدم بنجاح! ابدأ رحلتك من جديد.');
      render();
    });

    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(() => {}); }
    window.onload = () => {
      loadState();
      render();
    };
  </script>
</body>
</html>
