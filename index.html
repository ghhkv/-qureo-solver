<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الحلول الذكية | كوريو & الثقافة المالية ⚡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { cairo: ['Cairo', 'sans-serif'], tajawal: ['Tajawal', 'sans-serif'] },
                    colors: { space: '#05050a', neonCyan: '#00f3ff', neonPurple: '#bc13fe', neonPink: '#ff007f' }
                }
            }
        }
    </script>
    <style>
        :root { --cyan: #00f3ff; --purple: #bc13fe; --pink: #ff007f; --bg-dark: #05050a; }
        body { background-color: var(--bg-dark); color: #f8fafc; font-family: 'Tajawal', sans-serif; overflow-x: hidden; }
        h1, h2, h3, h4, .font-heading { font-family: 'Cairo', sans-serif; }
        #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .text-glow-cyan { text-shadow: 0 0 12px rgba(0, 243, 255, 0.7), 0 0 30px rgba(0, 243, 255, 0.4); }
        .gradient-text {
            background: linear-gradient(135deg, #00f3ff 0%, #bc13fe 50%, #ff007f 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 200% auto; animation: gradientFlow 5s ease infinite;
        }
        @keyframes gradientFlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .neon-card {
            position: relative; background: rgba(15, 17, 30, 0.72);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 1.25rem;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }
        .neon-card:hover {
            border-color: rgba(0, 243, 255, 0.45);
            box-shadow: 0 10px 35px -10px rgba(0, 243, 255, 0.25), 0 0 20px rgba(188, 19, 254, 0.15);
        }
        .btn-neon-primary {
            background: linear-gradient(90deg, #00f3ff, #bc13fe); color: #05050a; font-weight: 800;
            border-radius: 0.85rem; box-shadow: 0 0 20px rgba(0, 243, 255, 0.45); transition: all 0.25s ease;
        }
        .btn-neon-primary:hover { transform: scale(1.02); box-shadow: 0 0 30px rgba(0, 243, 255, 0.8); }
        .ambient-orb { position: fixed; border-radius: 50%; filter: blur(110px); z-index: -2; pointer-events: none; opacity: 0.32; }
        pre code { font-family: 'Courier New', monospace; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #05050a; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00f3ff, #bc13fe); border-radius: 10px; }
    </style>
</head>
<body class="antialiased selection:bg-neonCyan selection:text-space">

    <canvas id="bg-canvas"></canvas>
    <div class="ambient-orb w-96 h-96 bg-neonCyan top-[-5%] right-[-5%]"></div>
    <div class="ambient-orb w-[30rem] h-[30rem] bg-neonPurple bottom-[10%] left-[-10%]"></div>

    <!-- Navbar -->
    <header class="sticky top-0 z-50 pt-3 px-4">
        <div class="max-w-7xl mx-auto">
            <nav class="neon-card px-5 py-3.5 flex flex-wrap items-center justify-between gap-4">
                <a href="#" class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-neonCyan to-neonPurple p-[2px]">
                        <div class="w-full h-full bg-space rounded-[10px] flex items-center justify-center text-neonCyan font-black text-xl">
                            <i class="fa-solid fa-bolt"></i>
                        </div>
                    </div>
                    <span class="font-heading font-black text-xl text-white">
                        حلول<span class="text-neonCyan text-glow-cyan">.نيون</span>
                    </span>
                </a>

                <!-- أزرار التبديل بين المنصتين -->
                <div class="flex items-center gap-2 bg-space/80 p-1.5 rounded-xl border border-white/10">
                    <button id="tab-qureo" onclick="switchPlatform('qureo')" class="px-4 py-2 rounded-lg text-sm font-bold bg-neonCyan text-space shadow-[0_0_15px_rgba(0,243,255,0.5)] transition-all">
                        <i class="fa-solid fa-code ml-1"></i> كوريو (1 - 42)
                    </button>
                    <button id="tab-finance" onclick="switchPlatform('finance')" class="px-4 py-2 rounded-lg text-sm font-bold text-slate-300 hover:text-white transition-all">
                        <i class="fa-solid fa-coins ml-1"></i> الثقافة المالية (1 - 22)
                    </button>
                </div>

                <!-- مؤشر التقدم المحفوظ -->
                <div class="hidden sm:flex items-center gap-2 text-xs font-bold text-slate-300 bg-white/5 px-3.5 py-2 rounded-xl border border-white/10">
                    <i class="fa-solid fa-bookmark text-neonPurple"></i>
                    <span>آخر مستوى: <b id="saved-progress" class="text-neonCyan">المستوى 1</b></span>
                </div>
            </nav>
        </div>
    </header>

    <!-- Hero & Search -->
    <main class="max-w-7xl mx-auto px-4 pt-8 pb-20 space-y-8">
        <section class="text-center space-y-4">
            <h1 class="text-3xl sm:text-5xl font-black text-white">
                قاعدة الحلول الشاملة — <span id="platform-title" class="gradient-text">منصة كوريو للبرمجة</span>
            </h1>
            <p id="platform-subtitle" class="text-slate-400 max-w-2xl mx-auto text-sm sm:text-base">
                جميع حلول الدروس والمراجعات والأكواد البرمجية من المستوى 1 حتى 42 مع نسخ فوري بضغطة زر.
            </p>

            <!-- شريط البحث + اختيار المستوى -->
            <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-12 gap-3 pt-4">
                <div class="md:col-span-8 relative">
                    <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-neonCyan"></i>
                    <input id="search-input" type="text" oninput="renderContent()" placeholder="ابحث عن سؤال، كود، أو كلمة مفتاحية..." class="w-full pr-11 pl-4 py-3.5 rounded-xl bg-space/90 border border-neonCyan/40 text-white placeholder-slate-500 focus:outline-none focus:shadow-[0_0_20px_rgba(0,243,255,0.3)]">
                </div>
                <div class="md:col-span-4">
                    <select id="level-select" onchange="selectLevel(this.value)" class="w-full px-4 py-3.5 rounded-xl bg-space/90 border border-neonPurple/50 text-white font-bold focus:outline-none">
                        <option value="all">جميع المستويات</option>
                    </select>
                </div>
            </div>

            <!-- شريط أزرار المستويات السريع -->
            <div id="levels-pills" class="flex flex-wrap justify-center gap-2 pt-2 max-w-5xl mx-auto"></div>
        </section>

        <!-- حاوية عرض الحلول -->
        <section id="solutions-container" class="space-y-6"></section>
    </main>

    <!-- إشعار النسخ -->
    <div id="toast" class="fixed bottom-6 left-6 z-50 translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="neon-card px-5 py-3 border-neonCyan flex items-center gap-3 shadow-[0_0_25px_rgba(0,243,255,0.4)]">
            <i class="fa-solid fa-check-circle text-neonCyan text-lg"></i>
            <span id="toast-msg" class="text-sm font-bold text-white">تم النسخ بنجاح!</span>
        </div>
    </div>

    <!-- استدعاء قاعدة البيانات المولدة -->
    <script src="data.js"></script>
    <script>
        let currentPlatform = 'qureo';
        let selectedLevel = 'all';

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            t.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => t.classList.add('translate-y-24', 'opacity-0'), 2500);
        }

        function copyText(btn) {
            const text = btn.getAttribute('data-copy');
            navigator.clipboard.writeText(text).then(() => {
                showToast('تم نسخ الإجابة / الكود للحافظة ⚡');
                const oldHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> تم النسخ';
                setTimeout(() => btn.innerHTML = oldHtml, 1500);
            });
        }

        function switchPlatform(platform) {
            currentPlatform = platform;
            selectedLevel = 'all';
            document.getElementById('search-input').value = '';

            const qBtn = document.getElementById('tab-qureo');
            const fBtn = document.getElementById('tab-finance');

            if (platform === 'qureo') {
                qBtn.className = 'px-4 py-2 rounded-lg text-sm font-bold bg-neonCyan text-space shadow-[0_0_15px_rgba(0,243,255,0.5)] transition-all';
                fBtn.className = 'px-4 py-2 rounded-lg text-sm font-bold text-slate-300 hover:text-white transition-all';
                document.getElementById('platform-title').textContent = 'منصة كوريو للبرمجة (Qureo)';
                document.getElementById('platform-subtitle').textContent = 'المستويات من 1 إلى 42 — JavaScript, HTML, CSS والمراجعات النهائية.';
            } else {
                fBtn.className = 'px-4 py-2 rounded-lg text-sm font-bold bg-neonPurple text-white shadow-[0_0_15px_rgba(188,19,254,0.6)] transition-all';
                qBtn.className = 'px-4 py-2 rounded-lg text-sm font-bold text-slate-300 hover:text-white transition-all';
                document.getElementById('platform-title').textContent = 'منصة الثقافة المالية';
                document.getElementById('platform-subtitle').textContent = 'المستويات من 1 إلى 22 — حلول الدروس واختبارات المستوى الكاملة.';
            }

            populateLevels();
            renderContent();
        }

        function populateLevels() {
            const data = (window.SOLUTIONS_DB && window.SOLUTIONS_DB[currentPlatform]) || [];
            const select = document.getElementById('level-select');
            const pills = document.getElementById('levels-pills');

            select.innerHTML = '<option value="all">عرض كل المستويات (' + data.length + ')</option>';
            pills.innerHTML = '';

            data.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item.level;
                opt.textContent = `المستوى ${item.level}: ${item.title}`;
                select.appendChild(opt);

                const btn = document.createElement('button');
                btn.textContent = item.level;
                btn.title = item.title;
                btn.onclick = () => selectLevel(String(item.level));
                btn.className = `pill-btn px-3 py-1 rounded-lg text-xs font-bold border transition-all ${
                    String(selectedLevel) === String(item.level)
                    ? 'bg-neonCyan text-space border-neonCyan'
                    : 'bg-white/5 text-slate-300 border-white/10 hover:border-neonCyan/50'
                }`;
                pills.appendChild(btn);
            });
        }

        function selectLevel(lvl) {
            selectedLevel = lvl;
            document.getElementById('level-select').value = lvl;
            if (lvl !== 'all') {
                localStorage.setItem('last_level_' + currentPlatform, lvl);
                document.getElementById('saved-progress').textContent = 'المستوى ' + lvl;
            }
            populateLevels();
            renderContent();
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function renderContent() {
            const container = document.getElementById('solutions-container');
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const data = (window.SOLUTIONS_DB && window.SOLUTIONS_DB[currentPlatform]) || [];

            const saved = localStorage.getItem('last_level_' + currentPlatform) || '1';
            document.getElementById('saved-progress').textContent = 'المستوى ' + saved;

            let filtered = data.filter(lvl => {
                if (selectedLevel !== 'all' && String(lvl.level) !== String(selectedLevel)) return false;
                if (!query) return true;
                return lvl.title.toLowerCase().includes(query) || lvl.content.toLowerCase().includes(query);
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="neon-card p-10 text-center text-slate-400">لا توجد نتائج مطابقة لبحثك.</div>`;
                return;
            }

            // عرض أول 5 مستويات عند اختيار "الكل" بدون بحث لتسريع المتصفح، أو عرض المستوى المحدد بالكامل
            const toShow = (selectedLevel === 'all' && !query) ? filtered.slice(0, 5) : filtered;

            container.innerHTML = toShow.map(lvl => {
                const blocks = lvl.blocks || [{ heading: lvl.title, text: lvl.content }];
                const blocksHtml = blocks.map(b => `
                    <div class="bg-space/70 border border-white/10 rounded-xl p-4 space-y-3">
                        <div class="flex items-center justify-between gap-2 border-b border-white/10 pb-2">
                            <h4 class="font-bold text-neonCyan text-sm sm:text-base">${escapeHtml(b.heading)}</h4>
                            <button onclick="copyText(this)" data-copy="${escapeHtml(b.text)}" class="px-3 py-1.5 rounded-lg bg-neonCyan/10 border border-neonCyan/40 text-neonCyan hover:bg-neonCyan hover:text-space text-xs font-bold transition-all shrink-0">
                                <i class="fa-regular fa-copy"></i> نسخ
                            </button>
                        </div>
                        <pre class="whitespace-pre-wrap text-slate-200 text-xs sm:text-sm leading-relaxed font-tajawal overflow-x-auto" dir="auto">${escapeHtml(b.text)}</pre>
                    </div>
                `).join('');

                return `
                <article class="neon-card p-6 space-y-4">
                    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-white/10 pb-4">
                        <div class="flex items-center gap-3">
                            <span class="px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-neonCyan to-neonPurple text-space font-black text-sm">
                                المستوى ${lvl.level}
                            </span>
                            <h3 class="text-xl font-black text-white">${escapeHtml(lvl.title)}</h3>
                        </div>
                        <button onclick="selectLevel('${lvl.level}')" class="text-xs text-neonPurple hover:underline font-bold">
                            <i class="fa-solid fa-bookmark"></i> حفظ التقدم هنا
                        </button>
                    </div>
                    <div class="space-y-4">${blocksHtml}</div>
                </article>`;
            }).join('');

            if (selectedLevel === 'all' && !query && filtered.length > 5) {
                container.innerHTML += `
                <div class="neon-card p-6 text-center space-y-3 border-neonPurple/40">
                    <p class="text-slate-300 font-bold">يتم عرض أول 5 مستويات فقط للحفاظ على سرعة التصفح (${filtered.length} مستوى متاح).</p>
                    <p class="text-xs text-slate-400">اختر رقم المستوى من الأعلى أو استخدم شريط البحث للوصول الفوري لأي مستوى!</p>
                </div>`;
            }
        }

        // خلفية الجزيئات النيونية
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        for (let i = 0; i < 65; i++) {
            particles.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6,
                c: ['#00f3ff', '#bc13fe', '#ff007f'][i % 3]
            });
        }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath(); ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
                ctx.fillStyle = p.c; ctx.fill();
                for (let j = i + 1; j < particles.length; j++) {
                    const d = Math.hypot(p.x - particles[j].x, p.y - particles[j].y);
                    if (d < 120) {
                        ctx.beginPath(); ctx.strokeStyle = `rgba(0,243,255,${0.18 * (1 - d / 120)})`;
                        ctx.moveTo(p.x, p.y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke();
                    }
                }
            });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('DOMContentLoaded', () => switchPlatform('qureo'));
    </script>
</body>
</html>
