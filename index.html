<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة الحل التلقائي - Qureo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>تسجيل الدخول والحل التلقائي</h1>
        
        <form id="loginForm">
            <label for="username">اسم المستخدم / البريد:</label>
            <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>

            <label for="password">كلمة المرور:</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور" required>

            <button type="submit" id="loginButton">تسجيل الدخول والبدء</button>
        </form>

        <div id="progress" class="hidden">
            <p id="progressText">جاري المعالجة...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
